[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hash-patch"
version = "0.1.0"
description = "Hash Patch — offline cryptographic discovery and post-quantum risk analysis tool producing CycloneDX 1.6 CBOM output."
requires-python = ">=3.11"
dependencies = [
    "typer",
    "pydantic>=2",
    "pyyaml",
    "rich",
    "cyclonedx-python-lib",
    "cryptography>=50.0.0",
    "jsonschema",
    "tree-sitter>=0.25,<0.26",
    "tree-sitter-java",
    "tree-sitter-python",
    "tree-sitter-go",
    "tree-sitter-c",
    "python-hcl2>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "fastapi",
    "uvicorn",
    "httpx",
]
service = [
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.scripts]
hash-patch = "hash_patch.cli:app"
hashpatch = "hash_patch.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["hash_patch"]

[tool.ruff]
line-length = 100
extend-exclude = ["testdata", "tests/regression/fixtures", "scratch", "test1", "test2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]