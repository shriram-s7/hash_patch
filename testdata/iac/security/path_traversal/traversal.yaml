apiVersion: apps/v1
kind: Deployment
metadata:
  name: test
spec:
  selector:
    matchLabels:
      app: test
  template:
    metadata:
      labels:
        app: test
    spec:
      containers:
      - name: test
        image: test:latest
        volumeMounts:
        - name: config
          mountPath: /etc/config
      volumes:
      - name: config
        hostPath:
          path: ../../etc/passwd
          type: File