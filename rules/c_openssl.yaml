  # ---------------------------------------------------------------------------
  # HMAC (openssl/hmac.h) — found via the post-hashlib-fix audit (see
  # docs/COVERAGE.md): this file had ZERO HMAC coverage at all before this
  # addition. `EVP_DigestInit_ex(ctx, EVP_sha256(), NULL)`-style generic
  # digest calls needed NO new entry here — `EVP_sha256()` etc. above are
  # already matched independently of their enclosing call, since this
  # detector's walk visits every call_expression node in the tree, nested
  # or not (hash_patch/detect/c.py::_walk). HMAC_Init_ex/HMAC_Init/HMAC are
  # a genuinely separate finding (the MAC construction itself), additive to
  # whichever EVP_MD selector call already fires for the underlying hash.
  # ---------------------------------------------------------------------------
