# rules/entrypoints.yaml
#
# Config-driven entry-point tagging for pratyaksha/analyze/entrypoints.py.
#
# PRATYAKSHA constraint (same spirit as detection rules): the *patterns* that
# mark a function as a tagged entry point live here as data, not hardcoded in
# analyze/ Python code, so the list can be extended without touching analyze/.
#
# See docs/REACHABILITY.md for the full, authoritative definition of what
# counts as an entry point and — just as importantly — what does NOT. Nothing
# outside what is tagged here (or generated by the main_block/main_function
# rules below) is ever treated as an entry point; anything not matching is
# UNKNOWN, never assumed unreachable.

python:
  # A function decorated with @<anything>.<name>(...) or @<name>(...) where
  # <name> (the final identifier in the decorator expression) is one of
  # these is tagged as an entry point. Matched case-sensitively against the
  # last identifier segment of the decorator (so @app.route, @blueprint.route,
  # @app.get, @router.post, etc. all match via "route" / "get" / "post").
  decorator_names:
    - route          # Flask: @app.route(...)
    - get             # Flask/FastAPI: @app.get(...)
    - post            # Flask/FastAPI: @app.post(...)
    - put             # Flask/FastAPI: @app.put(...)
    - delete          # Flask/FastAPI: @app.delete(...)
    - patch           # FastAPI: @app.patch(...)
    - websocket       # FastAPI: @app.websocket(...)
    - api_view        # Django REST framework: @api_view([...])

  # The `if __name__ == "__main__":` block (matched structurally, not by
  # this config) is always treated as a synthetic entry point, and every
  # call it directly makes is entry-point-reachable.
  tag_main_block: true

  # Any module-level function named exactly one of these is an entry point,
  # regardless of decorators.
  main_function_names:
    - main

java:
  # A class carrying one of these annotations (marker or with arguments)
  # makes EVERY method declared directly in that class an entry point —
  # matches Spring-style @RestController classes where routing is declared
  # per-method via @GetMapping etc., but the controller class itself is the
  # thing that marks the surface as externally reachable.
  class_annotation_names:
    - RestController
    - Controller

  # A method carrying one of these annotations is an entry point regardless
  # of its class's own annotations.
  method_annotation_names:
    - GetMapping
    - PostMapping
    - PutMapping
    - DeleteMapping
    - PatchMapping
    - RequestMapping

  # A class carrying this annotation is a servlet; the conventional
  # lifecycle methods listed below are entry points on such a class.
  servlet_class_annotation_names:
    - WebServlet
  servlet_method_names:
    - doGet
    - doPost
    - doPut
    - doDelete

  # `public static void main(String[] args)` is always an entry point.
  tag_main_method: true
