# Strings that must NEVER be treated as cryptographic algorithm findings
false_positive_patterns:
  - "^keyboard$"
  - "^userKey$"
  - "^releaseKey$"
  - "^encryptButton$"
  - "^crypto_helper$"
  - "^key_manager$"
  - "^encryption_service$"
  - "^primaryKey$"
  - "^foreignKey$"
  - "^keyStore$"
  - "^keyEvent$"
  - "^keyPress$"
  - "^keyUp$"
  - "^keyDown$"
  - "^hotkey$"
