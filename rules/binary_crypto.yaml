    operation: "keygen"
    primitive: "signature"
    quantum_status: "broken-by-shor"
    oid: "1.2.840.10045.2.1"

  # --- OpenSSL AES ---
  AES_encrypt:
    library: "OpenSSL/libcrypto"
    algorithm: "AES"
    operation: "encrypt"
    primitive: "block-cipher"
    quantum_status: "weakened-by-grover"
