# rules/binary_crypto.yaml
# Detection rules for compiled artifacts and binaries (ELF, PE, Mach-O).
# Defines observable cryptographic libraries, symbols, operations, and false-positive filters.

libraries:
  - name: "OpenSSL/libcrypto"
    patterns:
      - "^libcrypto\\.so(?:\\.[0-9]+)*$"
      - "^libcrypto-[0-9]+.*\\.dll$"
      - "^libcrypto\\.dll$"
      - "^crypto\\.dll$"
      - "^libcrypto(?:\\.[0-9]+)*\\.dylib$"
  - name: "OpenSSL/libssl"
    patterns:
      - "^libssl\\.so(?:\\.[0-9]+)*$"
      - "^libssl-[0-9]+.*\\.dll$"
      - "^libssl\\.dll$"
      - "^ssl\\.dll$"
      - "^libssl(?:\\.[0-9]+)*\\.dylib$"
  - name: "libsodium"
    patterns:
      - "^libsodium\\.so(?:\\.[0-9]+)*$"
      - "^libsodium\\.dll$"
      - "^libsodium(?:\\.[0-9]+)*\\.dylib$"
  - name: "libgcrypt"
    patterns:
      - "^libgcrypt\\.so(?:\\.[0-9]+)*$"
      - "^libgcrypt\\.dll$"
      - "^libgcrypt(?:\\.[0-9]+)*\\.dylib$"
  - name: "BoringSSL"
    patterns:
      - "^libboringssl\\.so(?:\\.[0-9]+)*$"
      - "^libbssl\\.so(?:\\.[0-9]+)*$"
      - "^libbssl\\.dylib$"
      - "^libbssl\\.dll$"
  - name: "LibreSSL/libtls"
    patterns:
      - "^libtls\\.so(?:\\.[0-9]+)*$"
      - "^libtls\\.dylib$"
      - "^libtls\\.dll$"

symbols:
  # --- OpenSSL RSA ---
  RSA_public_encrypt:
    library: "OpenSSL/libcrypto"
    algorithm: "RSA"
    operation: "encrypt"
    primitive: "pke"
    quantum_status: "broken-by-shor"
    oid: "1.2.840.113549.1.1.1"

  RSA_private_decrypt:
    library: "OpenSSL/libcrypto"
    algorithm: "RSA"
    operation: "decrypt"
    primitive: "pke"
    quantum_status: "broken-by-shor"
    oid: "1.2.840.113549.1.1.1"

  RSA_sign:
    library: "OpenSSL/libcrypto"
    algorithm: "RSA"
    operation: "signature"
    primitive: "signature"
    quantum_status: "broken-by-shor"
    oid: "1.2.840.113549.1.1.1"

  RSA_verify:
