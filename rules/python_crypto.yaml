# rules/python_crypto.yaml
# Python cryptography library detection rules.
#
# Hash Patch constraint: all algorithm names, primitives, parameter sets, and
# quantum-status mappings belong here — never hardcoded in Python detector code.
#
# Two patterns are detected (both by inspecting "module.attribute" call shapes):
#
#   Pattern A — PyCA `cryptography` library (object/class constructor calls):
#     The "module" (left side) is a known namespace like `hashes`, `algorithms`,
#     `ec`, `rsa`, etc. The "attribute" (right side) names the algorithm/curve.
#     Examples:  hashes.SHA256()   algorithms.AES(key)   ec.SECP256R1()
#
#   Pattern B — pycryptodome / PyCrypto (module-level function calls):
#     The "object" (left side) IS the algorithm name, and the method is a
#     factory like `new` or `generate`.
#     Examples:  AES.new(key, AES.MODE_GCM)   RSA.generate(2048)   MD5.new()
#
# For Pattern A: the key in `pyca_modules` is the namespace identifier, and
#   the value is a dict mapping each attribute name → algo rule.
# For Pattern B: the key in `pycryptodome_classes` maps object-name.method
#   directly to an algo rule.
#
# quantum_status values mirror hash_patch.model.assets.QuantumStatus:
#   broken-by-shor        – asymmetric; vulnerable to Shor's algorithm on CRQC
#   weakened-by-grover    – symmetric/hash; key size halved by Grover
#   broken-classically    – already broken without a quantum computer
#   quantum-safe          – believed secure classically and quantum
#   unknown               – status not yet assessed

# ---------------------------------------------------------------------------
# Pattern A — PyCA `cryptography` library
#
# pyca_modules:
#   <namespace>:          # the left-hand identifier (e.g. "hashes")
#     <AttributeName>:    # the right-hand identifier (e.g. "SHA256")
#       canonical: <name> # canonical algorithm name for the CBOM
#       primitive: <str>
#       parameter_set: <str|null>
#       quantum_status: <str>
#       oid: <str|null>
# ---------------------------------------------------------------------------
pyca_modules:

  hashes:
