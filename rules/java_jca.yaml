# rules/java_jca.yaml
# Java JCA/JCE and BouncyCastle algorithm detection rules.
#
# PRATYAKSHA constraint: all algorithm names, primitives, parameter sets, and
# quantum-status mappings belong here — never hardcoded in Python detector code.
#
# Schema for each algorithm entry:
#   <canonical_name>:
#     primitive: <CycloneDX CryptoPrimitive value>
#     parameter_set: <string | null>   # key-size or security-level label
#     quantum_status: <QuantumStatus value>
#     oid: <dotted OID string | null>  # optional; omit if unknown
#
# quantum_status values mirror pratyaksha.model.assets.QuantumStatus:
#   broken-by-shor        – asymmetric, broken by Shor's algorithm on a CRQC
#   weakened-by-grover    – symmetric/hash, key size halved by Grover; safe at
#                           ≥256-bit / ≥128-bit post-quantum security level
#   broken-classically    – already broken without a quantum computer
#   quantum-safe          – believed secure against both classical and quantum
#   unknown               – status not yet assessed

# ---------------------------------------------------------------------------
# Target method signatures.
# Each entry: "<ClassName>.<methodName>"
# The detector matches method_invocation nodes whose object identifier and
# method name identifier together form one of these qualified names.
# Both JCA/JCE standard classes and BouncyCastle provider classes are listed.
# ---------------------------------------------------------------------------
target_methods:
  # JCA/JCE (javax.crypto / java.security)
  - "Cipher.getInstance"
  - "KeyPairGenerator.getInstance"
  - "MessageDigest.getInstance"
  - "Signature.getInstance"
  - "KeyGenerator.getInstance"
  - "Mac.getInstance"
  - "SecretKeyFactory.getInstance"
  - "AlgorithmParameters.getInstance"
  - "KeyFactory.getInstance"
  # BouncyCastle lightweight API (org.bouncycastle.crypto.*)
  # BC exposes its own engine classes; their constructor names contain the
  # algorithm, but the common API surface reached from JCA-style code uses
  # JCEKeyPairGenerator / JCECipher wrapped by Security.addProvider("BC").
  # The JCA-style calls (getInstance with "BC" as second arg) are already
  # covered above. The lightweight BC classes listed here are factory helpers:
  - "JcaX509CertificateConverter.getCertificate"
  - "JcaContentSignerBuilder.build"

# ---------------------------------------------------------------------------
# Algorithm rules.
# Keys are canonical algorithm names as they appear in JCA transformation
# strings, uppercased. The detector normalises the extracted string to
# uppercase and strips everything after the first "/" or "With" suffix before
# looking up here (e.g. "AES/GCM/NoPadding" → "AES",
# "SHA256WithRSAEncryption" → "SHA256WITHRSA" which falls back to "RSA",
# "ECDSAwithSHA256" → "ECDSAWITHSHA256" which falls back to "ECDSA").
#
# Fallback logic in detector (still no Python-hardcoded names):
#   1. Exact uppercase match.
#   2. Strip suffix after "/" → try again.
#   3. Strip suffix after "WITH" (case-insensitive) → try again.
# ---------------------------------------------------------------------------
algorithms:

  # ------------------------------------------------------------------
  # Asymmetric — vulnerable to Shor's algorithm on a CRQC
  # ------------------------------------------------------------------

  RSA:
    primitive: pke
    parameter_set: null          # key size not inferrable from name alone
    quantum_status: broken-by-shor
    oid: "1.2.840.113549.1.1.1"

  RSASSA-PSS:
    primitive: signature
    parameter_set: null
    quantum_status: broken-by-shor
    oid: "1.2.840.113549.1.1.10"

  EC:
    primitive: key-agree
    parameter_set: null
    quantum_status: broken-by-shor
    oid: "1.2.840.10045.2.1"

  ECDSA:
    primitive: signature
    parameter_set: null
    quantum_status: broken-by-shor
    oid: "1.2.840.10045.4.3.2"

  ECDH:
    primitive: key-agree
    parameter_set: null
    quantum_status: broken-by-shor
    oid: "1.3.132.1.12"

  DH:
    primitive: key-agree
    parameter_set: null
    quantum_status: broken-by-shor
    oid: "1.2.840.113549.1.3.1"

  DSA:
    primitive: signature
    parameter_set: null
    quantum_status: broken-by-shor
    oid: "1.2.840.10040.4.1"

  Ed25519:
    primitive: signature
    parameter_set: "255"
    quantum_status: broken-by-shor
    oid: "1.3.101.112"

  Ed448:
    primitive: signature
    parameter_set: "448"
    quantum_status: broken-by-shor
    oid: "1.3.101.113"

  X25519:
    primitive: key-agree
    parameter_set: "255"
    quantum_status: broken-by-shor
    oid: "1.3.101.110"

  X448:
    primitive: key-agree
    parameter_set: "448"
    quantum_status: broken-by-shor
    oid: "1.3.101.111"

  # ------------------------------------------------------------------
  # Symmetric block ciphers — key size halved by Grover
  # (AES-256 retains 128 bits of post-quantum security; still recommended)
  # ------------------------------------------------------------------

  AES:
    primitive: block-cipher
    parameter_set: null          # key size extracted from transformation string elsewhere
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.1"

  AES-128:
    primitive: block-cipher
    parameter_set: "128"
    quantum_status: weakened-by-grover
    oid: null

  AES-192:
    primitive: block-cipher
    parameter_set: "192"
    quantum_status: weakened-by-grover
    oid: null

  AES-256:
    primitive: block-cipher
    parameter_set: "256"
    quantum_status: weakened-by-grover
    oid: null

  # ------------------------------------------------------------------
  # Stream ciphers
  # ------------------------------------------------------------------

  ChaCha20:
    primitive: stream-cipher
    parameter_set: "256"
    quantum_status: weakened-by-grover
    oid: null

  ChaCha20-Poly1305:
    primitive: ae
    parameter_set: "256"
    quantum_status: weakened-by-grover
    oid: null

  # ------------------------------------------------------------------
  # Hash functions — not broken by Shor; Grover provides quadratic speedup
  # SHA-256 and above retain adequate post-quantum collision resistance
  # ------------------------------------------------------------------

  SHA-256:
    primitive: hash
    parameter_set: "256"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.1"

  SHA-384:
    primitive: hash
    parameter_set: "384"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.2"

  SHA-512:
    primitive: hash
    parameter_set: "512"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.3"

  SHA-512/256:
    primitive: hash
    parameter_set: "256"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.6"

  SHA3-256:
    primitive: hash
    parameter_set: "256"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.8"

  SHA3-384:
    primitive: hash
    parameter_set: "384"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.9"

  SHA3-512:
    primitive: hash
    parameter_set: "512"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.10"

  SHAKE128:
    primitive: xof
    parameter_set: "128"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.11"

  SHAKE256:
    primitive: xof
    parameter_set: "256"
    quantum_status: weakened-by-grover
    oid: "2.16.840.1.101.3.4.2.12"

  BLAKE2b:
    primitive: hash
    parameter_set: null
    quantum_status: weakened-by-grover
    oid: null

  BLAKE2s:
    primitive: hash
    parameter_set: null
    quantum_status: weakened-by-grover
    oid: null

  # ------------------------------------------------------------------
  # Classically broken algorithms
  # ------------------------------------------------------------------

  MD5:
    primitive: hash
    parameter_set: "128"
    quantum_status: broken-classically
    oid: "1.2.840.113549.2.5"

  SHA-1:
    primitive: hash
    parameter_set: "160"
    quantum_status: broken-classically
    oid: "1.3.14.3.2.26"

  SHA1:
    primitive: hash
    parameter_set: "160"
    quantum_status: broken-classically
    oid: "1.3.14.3.2.26"

  MD2:
    primitive: hash
    parameter_set: "128"
    quantum_status: broken-classically
    oid: "1.2.840.113549.2.2"

  MD4:
    primitive: hash
    parameter_set: "128"
    quantum_status: broken-classically
    oid: "1.2.840.113549.2.4"

  DES:
    primitive: block-cipher
    parameter_set: "56"
    quantum_status: broken-classically
    oid: "1.3.14.3.2.7"

  3DES:
    primitive: block-cipher
    parameter_set: "112"
    quantum_status: broken-classically
    oid: "1.2.840.113549.3.7"

  DESede:
    primitive: block-cipher
    parameter_set: "112"
    quantum_status: broken-classically
    oid: "1.2.840.113549.3.7"

  Blowfish:
    primitive: block-cipher
    parameter_set: null
    quantum_status: broken-classically
    oid: null

  RC2:
    primitive: block-cipher
    parameter_set: null
    quantum_status: broken-classically
    oid: "1.2.840.113549.3.2"

  RC4:
    primitive: stream-cipher
    parameter_set: null
    quantum_status: broken-classically
    oid: "1.2.840.113549.3.4"

  ARCFOUR:
    primitive: stream-cipher
    parameter_set: null
    quantum_status: broken-classically
    oid: null

  # ------------------------------------------------------------------
  # MACs
  # ------------------------------------------------------------------

  HmacSHA256:
    primitive: mac
    parameter_set: "256"
    quantum_status: weakened-by-grover
    oid: "1.2.840.113549.2.9"

  HmacSHA384:
    primitive: mac
    parameter_set: "384"
    quantum_status: weakened-by-grover
    oid: "1.2.840.113549.2.10"

  HmacSHA512:
    primitive: mac
    parameter_set: "512"
    quantum_status: weakened-by-grover
    oid: "1.2.840.113549.2.11"

  HmacMD5:
    primitive: mac
    parameter_set: "128"
    quantum_status: broken-classically
    oid: "1.3.6.1.5.5.8.1.1"

  HmacSHA1:
    primitive: mac
    parameter_set: "160"
    quantum_status: broken-classically
    oid: "1.2.840.113549.2.7"

  # ------------------------------------------------------------------
  # Key derivation
  # ------------------------------------------------------------------

  PBKDF2WithHmacSHA256:
    primitive: kdf
    parameter_set: null
    quantum_status: weakened-by-grover
    oid: null

  PBKDF2WithHmacSHA1:
    primitive: kdf
    parameter_set: null
    quantum_status: broken-classically
    oid: null
