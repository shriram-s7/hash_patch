# rules/go_crypto.yaml
# Go standard library crypto detection rules.
#
# Hash Patch constraint: all algorithm names, primitives, parameter sets, and
# quantum-status mappings belong here — never hardcoded in Python detector code.
#
# Schema for each entry in functions:
#   <pkg>.<FuncName>:
#     canonical: <string>              # Canonical algorithm name
#     primitive: <string>              # Primitive enum value
#     parameter_set: <string | null>   # Parameter set / key size identifier
#     mode: <string | null>            # Mode identifier (e.g. gcm)
#     quantum_status: <string>         # broken-by-shor | weakened-by-grover | broken-classically | quantum-safe | unknown
#     oid: <string | null>             # OID if known
#
# quantum_status values mirror hash_patch.model.assets.QuantumStatus:
#   broken-by-shor        – asymmetric; vulnerable to Shor's algorithm on CRQC
#   weakened-by-grover    – symmetric/hash; key size halved by Grover
#   broken-classically    – already broken without a quantum computer
#   quantum-safe          – believed secure classically and quantum
#   unknown               – status not yet assessed

